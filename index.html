<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Sequence Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        /* Create a tall container to allow scrolling */
        body {
            height: 500vh;
        }
        canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
    <!-- Include Lenis for smooth scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <style>
        html.lenis {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }
        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }
        .lenis.lenis-stopped {
            overflow: hidden;
        }
        .lenis.lenis-scrolling iframe {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="scroll-sequence"></canvas>

    <script>
        const canvas = document.getElementById("scroll-sequence");
        const context = canvas.getContext("2d");

        const frameCount = 236;
        const currentFrame = index => (
            `frames/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`
        );

        // Preload all images
        const images = [];
        
        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        // Draw the first frame once loaded
        images[0].onload = render;

        function render() {
            if (images[0].naturalWidth) {
                canvas.width = images[0].naturalWidth;
                canvas.height = images[0].naturalHeight;
                context.drawImage(images[0], 0, 0);
            }
        }

        // Lenis smooth scrolling setup
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            direction: 'vertical',
            gestureDirection: 'vertical',
            smooth: true,
            mouseMultiplier: 1,
            smoothTouch: false,
            touchMultiplier: 2,
            infinite: false,
        });

        lenis.on('scroll', (e) => {
            const scrollTop = window.scrollY;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            const frameIndex = Math.min(
                frameCount - 1,
                Math.max(0, Math.ceil(scrollFraction * frameCount) - 1)
            );
            
            if (images[frameIndex] && images[frameIndex].complete) {
                requestAnimationFrame(() => {
                    if (images[0].naturalWidth && canvas.width !== images[0].naturalWidth) {
                        canvas.width = images[0].naturalWidth;
                        canvas.height = images[0].naturalHeight;
                    }
                    context.drawImage(images[frameIndex], 0, 0);
                });
            }
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (images[0] && images[0].naturalWidth) {
                canvas.width = images[0].naturalWidth;
                canvas.height = images[0].naturalHeight;
                const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
                const scrollFraction = maxScrollTop > 0 ? window.scrollY / maxScrollTop : 0;
                const frameIndex = Math.min(
                    frameCount - 1,
                    Math.max(0, Math.ceil(scrollFraction * frameCount) - 1)
                );
                if (images[frameIndex] && images[frameIndex].complete) {
                    context.drawImage(images[frameIndex], 0, 0);
                }
            }
        });
    </script>
</body>
</html>
